# ============================================================
#  config.toml — ธีมของเว็บ
#  วางไว้ที่ root ของ repo เพราะ Streamlit Cloud อ่านจากโฟลเดอร์ที่รัน (root)
#  ตรึงธีมเป็นโหมดมืด ไม่ให้เปลี่ยนตามการตั้งค่าเครื่องผู้ใช้
#  เพราะ CSS ในหน้าเว็บออกแบบมาสำหรับพื้นหลังเข้ม
# ============================================================
[theme]
base                    = "dark"
primaryColor            = "#3b82f6"
backgroundColor         = "#0d1117"
secondaryBackgroundColor= "#161b26"
textColor               = "#e6eaf2"

[client]
toolbarMode = "minimal"
